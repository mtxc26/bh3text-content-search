<!DOCTYPE html><html lang="zh-CN" class="search-help"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>搜索 API 帮助 - 《崩坏3》文本搜索</title><link rel="stylesheet" href="/r/static/basic.css" /><link rel="stylesheet" href="/r/static/style.css" /><link rel="stylesheet" href="/r/static/search.css" /></head><body><h1>《崩坏3》文本搜索 API</h1><p>搜索《崩坏3》主线第一部、第二部及往世乐土的对话文本。</p><h2>HTML 搜索</h2><pre><code>GET /search?q={关键词}</code></pre><p>返回渲染好的 HTML 页面，包含匹配的关键词、上下文及指向对话页面的链接。</p><p>参数：</p><ul><li><code>q</code> - 搜索关键词</li><li><code>offset</code> - 结果偏移量</li><li><code>limit</code> - 每页结果数</li></ul><h2>JSON API</h2><pre><code>GET /search?q={关键词}&amp;format=json</code></pre><p>返回 JSON 格式的搜索结果。</p><h2>示例</h2><pre><code>GET /search?q=琪亚娜GET /search?q=芽衣&amp;format=json</code></pre><footer id=site_footer><a href="/">首页</a><span>|</span><a href="/about/">关于</a><span>|</span><div id=privacy_consent></div></footer><script type="module" src="/r/runtime/common.js"></script></body></html>
